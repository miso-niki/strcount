<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字数カウント</title>
<meta name="description" content="広告なし・シンプルな文字数カウントツール。入力はすべてブラウザ内で処理され、サーバーには送信されません。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236b5b3e'/%3E%3Ctext x='32' y='33' font-size='40' font-family='Hiragino Sans,Noto Sans JP,sans-serif' font-weight='700' fill='%23fbfbf9' text-anchor='middle' dominant-baseline='central'%3E文%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbf9;
    --fg: #1c1c1a;
    --muted: #6d6d64;
    --line: #e5e5df;
    --accent: #6b5b3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --fg: #ececea;
      --muted: #9a9a92;
      --line: #33332f;
      --accent: #c9b78c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 1.1rem 0.4rem;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .count-main {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .count-main .label { font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-right: 0.3rem; }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0.6rem 1.1rem;
  }
  textarea {
    width: min(1100px, 92vw);
    height: 62vh;
    min-height: 320px;
    resize: both;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    padding: 1rem 1.1rem;
    font-size: 0.875rem;
    line-height: 1.7;
    font-family: inherit;
  }
  textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  .toolbar { display: flex; justify-content: center; gap: 0.5rem; padding: 0 1.1rem; }
  button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 0.35rem 0.8rem;
    cursor: pointer;
  }
  button:hover { color: var(--fg); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tax { display: flex; justify-content: center; padding: 0.2rem 1.1rem 0.4rem; }
  .tax-inner {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 0.7rem 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 0.55rem 1rem; max-width: 92vw;
  }
  .tax-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .tax-field { font-size: 0.85rem; color: var(--muted); display: inline-flex; align-items: center; gap: 0.4rem; }
  .tax-field input {
    width: 9ch; font: inherit; font-size: 1rem; text-align: right;
    border: 1px solid var(--line); border-radius: 7px; background: transparent;
    color: var(--fg); padding: 0.3rem 0.5rem; font-variant-numeric: tabular-nums;
  }
  .tax-field input:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tax-arrow { color: var(--muted); }
  .tax-result { display: inline-flex; align-items: baseline; gap: 0.5rem; }
  .tax-excl { font-size: 1.3rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tax-amt { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; border-right: 1px solid var(--line); padding: 0.3rem 0.6rem; }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  #rounding {
    font: inherit; font-size: 0.85rem; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 7px; padding: 0.3rem 0.5rem; cursor: pointer;
  }

  footer {
    text-align: center;
    padding: 0.9rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>文字数カウント</h1>
    <div class="count-main" role="status" aria-live="polite"><span class="label">文字数</span><span id="total">0</span></div>
  </header>

  <section class="tax" aria-label="税込価格から税抜価格を計算">
    <div class="tax-inner">
      <span class="tax-title">税込→税抜</span>
      <label class="tax-field">税込
        <input id="taxIncl" type="text" inputmode="numeric" placeholder="0" aria-label="税込価格（整数）">
        円</label>
      <span class="tax-arrow" aria-hidden="true">→</span>
      <span class="tax-result" role="status" aria-live="polite">
        <span class="tax-excl" id="taxExcl">—</span>
        <span class="tax-amt" id="taxAmt"></span>
      </span>
      <span class="seg" role="group" aria-label="税率">
        <button type="button" data-n="10" data-d="11" aria-pressed="true">10%</button>
        <button type="button" data-n="25" data-d="27" aria-pressed="false">8%</button>
      </span>
      <select id="rounding" aria-label="端数処理">
        <option value="floor">切り捨て</option>
        <option value="round">四捨五入</option>
        <option value="ceil">切り上げ</option>
      </select>
    </div>
  </section>

  <main>
    <textarea id="input" aria-label="文字数を数えるテキスト" placeholder="ここに入力・貼り付け" autofocus></textarea>
  </main>

  <div class="toolbar">
    <button id="copy">コピー</button>
    <button id="clear">全消去</button>
  </div>

  <footer>
    ブラウザ内で完結 · powered by <a href="https://nitta-jozo.co.jp/" target="_blank" rel="noopener noreferrer">nitta-jozo</a>
  </footer>

<script>
  const input = document.getElementById('input');
  const totalEl = document.getElementById('total');
  const copyBtn = document.getElementById('copy');
  const fmt = n => n.toLocaleString('ja-JP');

  // 「見た目どおりの1文字」で数える（書記素クラスタ単位）。
  // 国旗・合字絵文字・結合文字なども1文字として扱える。非対応環境はコードポイントで代替。
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter)
    ? new Intl.Segmenter('ja', { granularity: 'grapheme' })
    : null;
  const countChars = s => {
    if (!s) return 0;
    return seg ? [...seg.segment(s)].length : [...s].length;
  };

  function update() {
    totalEl.textContent = fmt(countChars(input.value));
  }

  input.addEventListener('input', update);

  document.getElementById('clear').addEventListener('click', () => {
    input.value = '';
    update();
    input.focus();
  });

  let copyResetTimer;
  function flashCopy(label) {
    copyBtn.textContent = label;
    clearTimeout(copyResetTimer);
    copyResetTimer = setTimeout(() => { copyBtn.textContent = 'コピー'; }, 1200);
  }
  copyBtn.addEventListener('click', async () => {
    if (!input.value) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(input.value);
      } else {
        input.select();
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
      }
      flashCopy('コピーしました');
    } catch (e) {
      flashCopy('コピーできませんでした');
    }
  });

  // --- 税込 → 税抜 計算 ---
  const taxIncl = document.getElementById('taxIncl');
  const taxExclEl = document.getElementById('taxExcl');
  const taxAmtEl = document.getElementById('taxAmt');
  const roundingSel = document.getElementById('rounding');
  // 税抜 = 税込 / (1+税率) を有理数で計算し浮動小数点誤差を防ぐ。
  // 10% → ×10÷11、8% → ×25÷27（例: 1100→1000, 1080→1000 が正確に出る）
  let mulN = 10, mulD = 11;
  let rounding = 'floor';

  function calcTax() {
    // 全角数字も受け付ける（NFKC正規化）。整数円のみ有効。
    const s = taxIncl.value.normalize('NFKC').trim();
    if (!/^\d+$/.test(s)) {
      taxExclEl.textContent = '—';
      taxAmtEl.textContent = '';
      return;
    }
    const v = Number(s);
    const raw = (v * mulN) / mulD;
    const excl = rounding === 'floor' ? Math.floor(raw)
               : rounding === 'ceil'  ? Math.ceil(raw)
               : Math.round(raw);
    const tax = v - excl;
    taxExclEl.textContent = '¥' + fmt(excl);
    taxAmtEl.textContent = '消費税 ¥' + fmt(tax);
  }

  taxIncl.addEventListener('input', calcTax);
  roundingSel.addEventListener('change', () => { rounding = roundingSel.value; calcTax(); });
  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      mulN = parseInt(b.dataset.n, 10);
      mulD = parseInt(b.dataset.d, 10);
      calcTax();
    });
  });

  update();
  calcTax();
</script>
</body>
</html>
